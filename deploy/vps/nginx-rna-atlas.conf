resolver 127.0.0.53 valid=300s ipv6=off;
resolver_timeout 5s;

# Resolve the external UCSC host at request time. A transient DNS failure during
# boot or a package-triggered nginx restart must not take the RNA Atlas offline.
upstream ucsc_cells {
    zone ucsc_cells 64k;
    server cells.ucsc.edu:443 resolve;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name mosquito.rockefeller.edu;

    ssl_certificate     /etc/letsencrypt/live/mosquito.rockefeller.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mosquito.rockefeller.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The bundled comparison reports are ~5 MB each.
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Serve the app favicon directly so the browser never sees Streamlit's
    # default icon (set_page_config only swaps it via JS after connect).
    location = /favicon.png {
        alias /opt/rna-atlas/app/assets/favicon.png;
        expires 7d;
    }
    location = /favicon.ico {
        alias /opt/rna-atlas/app/assets/favicon.png;
        expires 7d;
    }

    # Same-origin proxy for the UCSC Cell Browser embeds. Their first-visit
    # tutorial popup is gated only by localStorage in their origin, which we
    # cannot touch cross-origin — so we proxy the app and patch the one
    # getItem("introShown") call in their JS. All their asset and data URLs are
    # relative, so the app works unchanged under this subpath.
    location /ucsc/ {
        proxy_pass https://ucsc_cells/;
        proxy_ssl_server_name on;
        proxy_ssl_name cells.ucsc.edu;
        proxy_set_header Host cells.ucsc.edu;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        sub_filter_types application/javascript text/javascript;
        sub_filter 'localStorage.getItem("introShown")' '"true"';
    }

    location / {
        # Inject the loading overlay, favicon, and title into Streamlit's static
        # index.html so they are present from the first byte — anything sent
        # through the app itself only arrives over the websocket, after the
        # skeleton has already flashed. sub_filter only touches text/html.
        proxy_set_header Accept-Encoding "";
        sub_filter '<link rel="shortcut icon" href="./favicon.png" />'
                   '<link rel="shortcut icon" href="/favicon.png?v=dna" />';
        sub_filter '<title>Streamlit</title>' '<title>Aedes RNA Atlas</title>';
        sub_filter '</head>' '<style>
            .bzz-overlay{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0E1518;transition:opacity .5s ease}
            .bzz-overlay .bzz-mosquito{position:absolute;top:50%;left:50%;font-size:3rem;animation:bzz-bounce 4.5s linear infinite}
            .bzz-overlay .bzz-text{font-family:sans-serif;font-size:2.6rem;font-weight:800;letter-spacing:.12em;white-space:nowrap;background:linear-gradient(90deg,#2f7a5f 0%,#2f7a5f 38%,#a9f5d5 50%,#2f7a5f 62%,#2f7a5f 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:bzz-roll 1.6s linear infinite}
            @keyframes bzz-roll{0%{background-position:100% 0}100%{background-position:0% 0}}
            @keyframes bzz-bounce{0%{transform:translate(-42vw,-38vh) rotate(-14deg)}9%{transform:translate(28vw,-42vh) rotate(18deg)}19%{transform:translate(41vw,12vh) rotate(-8deg)}28%{transform:translate(-12vw,33vh) rotate(22deg)}38%{transform:translate(-44vw,18vh) rotate(-19deg)}48%{transform:translate(8vw,-19vh) rotate(11deg)}58%{transform:translate(38vw,39vh) rotate(-24deg)}68%{transform:translate(-31vw,-27vh) rotate(16deg)}78%{transform:translate(19vw,26vh) rotate(-11deg)}88%{transform:translate(-21vw,-44vh) rotate(24deg)}100%{transform:translate(-42vw,-38vh) rotate(-14deg)}}
        </style></head>';
        sub_filter '<body>' '<body><div class="bzz-overlay"><div class="bzz-mosquito">🦟</div><div class="bzz-text">bzzz</div></div><script>(function(){var gone=false;var zi=setInterval(function(){var t=document.querySelector(".bzz-text");if(t&&!gone){t.textContent+="z"}},1000);var done=function(){if(gone)return;gone=true;clearInterval(zi);var o=document.querySelector(".bzz-overlay");if(o){o.style.opacity=0;setTimeout(function(){o.remove()},550)}};var iv=setInterval(function(){if(document.querySelector(".bzz-done")){done();clearInterval(iv)}},80);setTimeout(function(){done();clearInterval(iv)},25000)})();</script>';

        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
