server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/rna-atlas.crt;
    ssl_certificate_key /etc/nginx/ssl/rna-atlas.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The bundled comparison reports are ~5 MB each.
    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Serve the app favicon directly so the browser never sees Streamlit's
    # default icon (set_page_config only swaps it via JS after connect).
    location = /favicon.png {
        alias /opt/rna-atlas/app/assets/favicon.png;
        expires 7d;
    }
    location = /favicon.ico {
        alias /opt/rna-atlas/app/assets/favicon.png;
        expires 7d;
    }

    location / {
        # Inject the loading overlay, favicon, and title into Streamlit's static
        # index.html so they are present from the first byte — anything sent
        # through the app itself only arrives over the websocket, after the
        # skeleton has already flashed. sub_filter only touches text/html.
        proxy_set_header Accept-Encoding "";
        sub_filter '<link rel="shortcut icon" href="./favicon.png" />'
                   '<link rel="shortcut icon" href="/favicon.png?v=dna" />';
        sub_filter '<title>Streamlit</title>' '<title>Aedes RNA Atlas</title>';
        sub_filter '</head>' '<style>
            .bzz-overlay{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;background:#0E1518;transition:opacity .5s ease}
            .bzz-overlay .bzz-mosquito{font-size:3rem}
            .bzz-overlay .bzz-text{color:#53D6A5;font-family:sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.12em;animation:bzz-pulse 1.1s ease-in-out infinite}
            @keyframes bzz-pulse{0%,100%{opacity:.45}50%{opacity:1}}
        </style></head>';
        sub_filter '<body>' '<body><div class="bzz-overlay"><div class="bzz-mosquito">🦟</div><div class="bzz-text">bzzzzz</div></div><script>(function(){var gone=false;var done=function(){if(gone)return;gone=true;var o=document.querySelector(".bzz-overlay");if(o){o.style.opacity=0;setTimeout(function(){o.remove()},550)}};var iv=setInterval(function(){if(document.querySelector(".bzz-done")){done();clearInterval(iv)}},80);setTimeout(function(){done();clearInterval(iv)},25000)})();</script>';

        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
